name: agent_book_reader
description: "AgentBookReader - cross-platform e-book reader with built-in AI agent."
publish_to: 'none'

version: 1.0.4+4

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  file_selector: ^1.0.3
  shared_preferences: ^2.3.2
  enough_convert: ^1.6.0
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  path_provider: ^2.1.4
  archive: ^4.2.0
  xml: ^7.0.1
  http: ^1.6.0
  flutter_secure_storage: ^11.0.0
  pdfrx: ^2.5.0
  wakelock_plus: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.12
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

# Regenerate android/app/src/main/res/mipmap-* via:
#   dart run flutter_launcher_icons
# Icon sources are produced by: python tool/gen_app_icon.py
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
